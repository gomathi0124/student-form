<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
    <style>
        /* Basic CSS for styling the form and table */
        body {
            font-family: Arial, sans-serif;
        }
        form {
            margin-bottom: 20px;
        }
        input[type="text"], input[type="number"], select {
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h2>Student Form</h2>
    <form id="studentForm">
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            <span id="nameError" class="error"></span>
        </div>
        <div>
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required>
             <span id="ageError" class="error"></span>
        </div>
         <div>
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
            <span id="genderError" class="error"></span>
        </div>
        <div>
            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value="">Select Course</option>
                <option value="JavaScript">JavaScript</option>
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <!-- Add more courses as needed -->
            </select>
             <span id="courseError" class="error"></span>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="text" id="email" name="email" required>
             <span id="emailError" class="error"></span>
        </div>
        <button type="button" onclick="validateAndSubmit()">Save</button>
    </form>
    <h2>Student Details</h2>
    <table id="studentTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
                <th>Gender</th>
                <th>Email</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
             <!-- Data rows will be added here dynamically -->
        </tbody>
    </table>
    <script>
        function validateAndSubmit() {
          //Reset error messages
          document.getElementById('nameError').textContent = '';
          document.getElementById('ageError').textContent = '';
          document.getElementById('genderError').textContent = '';
          document.getElementById('courseError').textContent = '';
          document.getElementById('emailError').textContent = '';
      
          //Validate name
          let name = document.getElementById('name').value;
          if (!name) {
              document.getElementById('nameError').textContent = 'Name is required';
              return;
          }
      
           // Validate age
          let age = document.getElementById('age').value;
          if (!age || isNaN(age) || age <= 0) {
              document.getElementById('ageError').textContent = 'Valid age is required';
              return;
          }
      
          // Validate gender
          let gender = document.getElementById('gender').value;
          if (!gender) {
              document.getElementById('genderError').textContent = 'Gender is required';
              return;
          }
      
          // Validate course
          let course = document.getElementById('course').value;
          if (!course) {
              document.getElementById('courseError').textContent = 'Course is required';
              return;
          }
      
          // Validate email
           let email = document.getElementById('email').value;
          if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
              document.getElementById('emailError').textContent = 'Valid email is required';
              return;
          }

            // If all validations pass, submit the form
            submitForm();
        }
        
        function submitForm() {
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            const course = document.getElementById('course').value;
            const email = document.getElementById('email').value;
            
             // Get the table body to append rows
            const tableBody = document.getElementById('studentTable').querySelector('tbody');

            // Create a new row
            const newRow = tableBody.insertRow();

            // Insert cells and add data
            const cell1 = newRow.insertCell(0);
            cell1.textContent = name;

            const cell2 = newRow.insertCell(1);
            cell2.textContent = age;

            const cell3 = newRow.insertCell(2);
            cell3.textContent = course;

            const cell4 = newRow.insertCell(3);
            cell4.textContent = gender;
            
            const cell5 = newRow.insertCell(4);
            cell5.textContent = email;

            const cell6 = newRow.insertCell(5);
            const deleteButton = document.createElement('button');
            deleteButton.textContent = 'Delete';
             deleteButton.onclick = function() {
                tableBody.removeChild(newRow);
            };
            cell6.appendChild(deleteButton);
            
            // Clear the form
            document.getElementById('studentForm').reset();
        }
    </script>
</body>
</html>
